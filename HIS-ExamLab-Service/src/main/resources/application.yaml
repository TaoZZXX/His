server:
  port: 8085
spring:
  application:
    name: his-exam-lab-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        service: his-exam-lab-service
      config:
        server-addr: localhost:8848
        file-extension: yaml
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/his?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: his@2026#JwtSecretKey_1234567890_abcdefg
  expire:
    minutes: 120

his:
  temp-file:
    exam-result-dir: ../HIS-TempFile

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{X-B3-TraceId:-},%X{X-B3-SpanId:-},user:%X{userId:-}]"
