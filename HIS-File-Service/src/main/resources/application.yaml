server:
  port: 8091

spring:
  application:
    name: his-file-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        service: his-file-service
      config:
        server-addr: localhost:8848
        file-extension: yaml
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
