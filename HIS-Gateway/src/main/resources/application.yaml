spring:
  application:
    name: HIS-Gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        service: HIS-Gateway
      config:
        server-addr: localhost:8848
        file-extension: yaml
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/his?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  redis:
    host: localhost
    port: 6379
    database: 0
    password: 123456
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
server:
  port: 9999

jwt:
  secret: his@2026#JwtSecretKey_1234567890_abcdefg

# 管理员角色放行配置：填写 sms_role 表中管理员角色的 id，逗号分隔
# 例如：1 代表 sms_role.id=1
permission:
  admin:
    role-ids: 1

zuul:
  host:
    connect-timeout-millis: 3000
    socket-timeout-millis: 10000
  semaphore:
    max-semaphores: 200
  routes:
    his-auth:
      path: /sms/staff/**
      url: http://localhost:8082/staff/
      strip-prefix: true
    his-role:
      path: /sms/role/**
      url: http://localhost:8082/role/
      strip-prefix: true
    his-registration:
      path: /sms/registration/**
      url: http://localhost:8083/registration/
      strip-prefix: true
    his-doctor:
      path: /sms/doctor/**
      url: http://localhost:8084/doctor/
      strip-prefix: true
    his-exam-lab:
      path: /sms/exam-lab/**
      url: http://localhost:8085/exam-lab/
      strip-prefix: true
    his-finance:
      path: /sms/finance/**
      url: http://localhost:8086/finance/
      strip-prefix: true
    his-pharmacy:
      path: /sms/pharmacy/**
      url: http://localhost:8087/pharmacy/
      strip-prefix: true
    his-home:
      path: /sms/home/**
      url: http://localhost:8088/home/
      strip-prefix: true
    his-notify:
      path: /sms/notify/**
      url: http://localhost:8089/notify/
      strip-prefix: true
    his-job:
      path: /sms/job/**
      url: http://localhost:8090/job/
      strip-prefix: true
    his-file:
      path: /sms/file/**
      url: http://localhost:8091/file/
      strip-prefix: true
legacy:
  alias:
    auth-base-url: http://localhost:8082
    registration-base-url: http://localhost:8083

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{X-B3-TraceId:-},%X{X-B3-SpanId:-},user:%X{userId:-}]"
  level:
    com.netflix.zuul: DEBUG
    org.springframework.cloud.netflix.zuul: DEBUG
    org.springframework.cloud.netflix.zuul.filters: DEBUG
    org.springframework.cloud.netflix.zuul.filters.route: DEBUG
    com.netflix.ribbon: DEBUG
  file:
    name: logs/his-gateway.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
