server:
  port: 8084
spring:
  application:
    name: his-doctor-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        service: his-doctor-service
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/his?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
jwt:
  secret: his@2026#JwtSecretKey_1234567890_abcdefg
  expire:
    minutes: 120
