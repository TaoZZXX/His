groups:
  - name: his-service-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service down: {{ $labels.instance }}"
          description: "Prometheus cannot scrape {{ $labels.instance }} for over 1 minute."

      - alert: HighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (instance) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate: {{ $labels.instance }}"
          description: "HTTP 5xx rate is above threshold for 2 minutes."
