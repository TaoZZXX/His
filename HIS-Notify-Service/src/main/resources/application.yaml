server:
  port: 8089

spring:
  application:
    name: his-notify-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        service: his-notify-service
      config:
        server-addr: localhost:8848
        file-extension: yaml
  zipkin:
    base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
